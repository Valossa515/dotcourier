name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger trx --results-directory TestResults
        env:
          # Runs the tests that need Docker, e.g. Kafka end to end (Testcontainers).
          DOTCOURIER_DOCKER_TESTS: "true"

      - name: Pack
        run: dotnet pack --no-build -c Release -o artifacts

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-output
          path: |
            TestResults
            artifacts

  native-aot:
    # Publishes a console app with Native AOT (any trimming/AOT warning fails the publish) and runs it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish with Native AOT
        run: dotnet publish tests/DotCourier.AotSmoke -c Release -r linux-x64 -o aot-out

      - name: Run the native binary
        run: ./aot-out/DotCourier.AotSmoke
