name: ✨ Feature request
description: Suggest a behavior, module or API improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Check the [roadmap](https://github.com/Valossa515/dotcourier#%EF%B8%8F-roadmap) first; it may already be planned.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work? API sketches are very welcome.
      render: csharp
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core (dispatcher, pipeline, notifications)
        - Validation
        - Telemetry
        - ASP.NET Core integration
        - Resilience
        - New module (caching, outbox, messaging, ...)
        - MediatR compatibility
        - Other
    validations:
      required: true

  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to implement it?
      options:
        - "Yes"
        - "Maybe, with guidance"
        - "No"
