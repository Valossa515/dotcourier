name: 🐛 Bug report
description: Something in DotCourier doesn't work as documented
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! For security issues, **don't** use this form: follow [SECURITY.md](https://github.com/Valossa515/dotcourier/blob/main/SECURITY.md).
        Issues in Portuguese are welcome too. / Issues em português também são bem-vindas.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest request + handler + `AddCourier` configuration that shows the problem.
      render: csharp
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      render: shell

  - type: dropdown
    id: packages
    attributes:
      label: Affected package(s)
      multiple: true
      options:
        - DotCourier
        - DotCourier.AspNetCore
        - DotCourier.Resilience
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: DotCourier version
      placeholder: "e.g. 0.2.0"
    validations:
      required: true

  - type: dropdown
    id: dotnet
    attributes:
      label: .NET version
      options:
        - ".NET 10"
        - ".NET 9"
        - ".NET 8"
        - Other
    validations:
      required: true

  - type: input
    id: mediatr
    attributes:
      label: Migrating from MediatR? Which version?
      placeholder: "e.g. 12.4.1 (leave empty if not migrating)"

  - type: textarea
    id: context
    attributes:
      label: Additional context
