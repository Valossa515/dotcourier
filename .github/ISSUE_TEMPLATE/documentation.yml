name: 📖 Documentation
description: Something in the docs is missing, wrong or unclear
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: where
    attributes:
      label: Where?
      description: File or section (e.g. README.md › Resilience, or an XML doc comment).
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What's wrong or missing?
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording
